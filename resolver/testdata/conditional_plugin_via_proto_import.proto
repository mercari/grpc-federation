syntax = "proto3";

package org.consumer;

import "grpc/federation/federation.proto";
// Proto-import of a file whose plugin.export block would, under
// option-import semantics, register a CEL plugin. Under
// conditional-plugin-import semantics, this proto-import loads the file
// for type resolution but does NOT auto-register the plugin.
import "conditional_plugin.proto";

option go_package = "example/consumerregular;consumerregular";

service ConsumerRegular {
  option (grpc.federation.service) = {};
}
